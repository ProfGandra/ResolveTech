<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
    <stop stop-color="#fce7f3"/>
    <stop offset="1" stop-color="#eef2ff"/>
  </linearGradient>
  <linearGradient id="shirt" x1="0" x2="1">
    <stop stop-color="#7c3aed"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
</defs>

<rect width="200" height="260" rx="8" fill="url(#bg)"/>

<!-- hair: long, soft and generic -->
<path d="M45 82c0-43 24-66 55-66s55 23 55 66v72c-11 22-31 34-55 34s-44-12-55-34z" fill="#3a2b2a"/>
<path d="M45 89c-7 31-3 75 16 105l22-18-8-91z" fill="#3a2b2a"/>
<path d="M155 89c7 31 3 75-16 105l-22-18 8-91z" fill="#3a2b2a"/>

<!-- face -->
<ellipse cx="100" cy="88" rx="44" ry="48" fill="#e0ad86"/>
<path d="M58 73c9-38 30-50 49-49 18 1 34 10 44 31-17-8-34-11-50-8-17 2-31 11-43 26z" fill="#3a2b2a"/>
<path d="M65 61c11 10 23 15 38 15 14 0 27-5 39-15" fill="none" stroke="#3a2b2a" stroke-width="11" stroke-linecap="round"/>

<!-- round geek glasses -->
<circle cx="79" cy="89" r="18" fill="rgba(255,255,255,.12)" stroke="#111827" stroke-width="5"/>
<circle cx="121" cy="89" r="18" fill="rgba(255,255,255,.12)" stroke="#111827" stroke-width="5"/>
<path d="M97 88h6M60 84l-12-4M140 84l12-4" stroke="#111827" stroke-width="4" stroke-linecap="round"/>

<!-- eyes -->
<circle cx="79" cy="89" r="4" fill="#1f2937"/>
<circle cx="121" cy="89" r="4" fill="#1f2937"/>
<circle cx="77.5" cy="87.5" r="1.2" fill="#fff"/>
<circle cx="119.5" cy="87.5" r="1.2" fill="#fff"/>

<!-- brows -->
<path d="M69 70c7-4 14-4 20-1M111 69c6-3 13-3 20 1" fill="none" stroke="#4b2f2d" stroke-width="4" stroke-linecap="round"/>

<!-- subtle nose and smile -->
<path d="M100 91c-2 7-3 11 1 13" fill="none" stroke="#b9795f" stroke-width="2.5" stroke-linecap="round"/>
<path d="M86 116c9 8 19 8 28 0" fill="none" stroke="#9f4960" stroke-width="4" stroke-linecap="round"/>

<!-- small earrings -->
<circle cx="57" cy="101" r="3" fill="#a78bfa"/>
<circle cx="143" cy="101" r="3" fill="#a78bfa"/>

<!-- clothing -->
<path d="M34 247c4-63 25-91 66-91s62 28 66 91z" fill="url(#shirt)"/>
<path d="M74 159 100 191l26-32" fill="#f8fafc" opacity=".95"/>
<path d="M93 196h14v19H93z" rx="3" fill="#111827"/>
<circle cx="100" cy="201" r="3" fill="#22c55e"/>

<!-- border -->
<rect x="16" y="15" width="168" height="230" rx="5" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>